# BiasGuard (Streamlit)
server {
    listen 443 ssl;
    server_name biasguard.prufai.de;

    ssl_certificate /etc/letsencrypt/live/prufai.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prufai.de/privkey.pem;

    location / {
        proxy_pass http://sameersemna-atlas.nord:8501;
        
        # Critical for Streamlit WebSockets & Static Files
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        
        # Buffer tweaks to prevent 'Empty Response' on larger files
        proxy_buffering off;
        proxy_redirect off;
        
        # Standard forwarding headers
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

